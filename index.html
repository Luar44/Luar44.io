<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Construcción</title>
    <style>
        /* Estilos generales para ocupar toda la pantalla y centrar el contenido */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #222222; /* Gris oscuro */
            color: #ffffff; /* Texto blanco para que resalte */
            font-family: Arial, sans-serif;
        }

        /* Estilos para el mensaje */
        .container {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #aaaaaa; /* Gris más claro para el subtítulo */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sitio en Construcción</h1>
        <p>Estamos trabajando para ofrecerte una mejor experiencia muy pronto.</p>
    </div>

</body>
</html>
